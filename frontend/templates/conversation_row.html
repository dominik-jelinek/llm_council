<div class="conversation-row{% if conversation and item.id == conversation.id %} active{% endif %}"
     draggable="true" data-conversation-id="{{ item.id }}">
  <a class="conversation-item" draggable="false"
     href="/conversations/{{ item.id }}" hx-get="/conversations/{{ item.id }}"
     hx-target="#workspace" hx-swap="outerHTML" hx-push-url="true"
     {% if conversation and item.id == conversation.id %}aria-current="page"{% endif %}>
    <span class="conversation-title">{{ item.title }}</span>
    <span class="conversation-meta">{{ item.message_count }} messages</span>
  </a>
  <a class="conversation-menu-button sidebar-icon-button" href="/conversations/{{ item.id }}/project"
     role="button" aria-label="Move conversation: {{ item.title }}" title="Move to project" aria-haspopup="dialog"
     hx-get="/conversations/{{ item.id }}/project" hx-target="#project-editor" hx-swap="outerHTML" hx-include="#sidebar-context">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
      <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
    </svg>
  </a>
  <form class="delete-conversation-form" action="/conversations/{{ item.id }}/delete" method="post"
        hx-post="/conversations/{{ item.id }}/delete" hx-target="#sidebar" hx-swap="outerHTML"
        hx-disabled-elt="find button">
    <input type="hidden" name="current_conversation_id" value="{{ conversation.id if conversation else '' }}">
    <input type="hidden" name="current_project_id" value="{{ project.id if project and not conversation else '' }}">
    <button class="delete-conversation-button sidebar-icon-button" type="submit" aria-label="Delete conversation: {{ item.title }}" title="Delete conversation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6" />
      </svg>
    </button>
  </form>
</div>
