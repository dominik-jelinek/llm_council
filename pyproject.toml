[project]
name = "llm-council"
version = "0.1.0"
description = "Your LLM Council"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.15.0",
    "openrouter>=1.3.202",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
