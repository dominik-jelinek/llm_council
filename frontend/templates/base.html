<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"historyCacheSize":0,"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'>
    <title>LLM Council</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/markdown.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/sse.js" defer></script>
    <script src="/static/drafts.js" defer></script>
    <script src="/static/projects.js" defer></script>
    <script src="/static/sidebar-scroll.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div id="app" hx-sync="this:replace">
      {% block content %}{% endblock %}
      {% if not standalone_setup %}
      <dialog id="council-dialog" aria-labelledby="council-setup-title">
        <div id="council-settings"></div>
      </dialog>
      <dialog id="usage-dialog" aria-labelledby="usage-dialog-title">
        <div id="usage-dialog-content"></div>
      </dialog>
      <dialog id="project-dialog" aria-labelledby="project-editor-title">
        <div id="project-editor"></div>
      </dialog>
      {% endif %}
    </div>
  </body>
</html>
